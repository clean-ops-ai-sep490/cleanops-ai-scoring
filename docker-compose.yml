services:
  cleanops-ai-scoring-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: ${SCORING_REQUIREMENTS_FILE:-requirements.inference.txt}
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_RELOAD=false
      - APP_PUBLIC_BASE_URL=${APP_PUBLIC_BASE_URL:-}
      - BASE_OUTPUT_DIR=/app/outputs
      - YOLO_TRAIN_PROJECT_DIR=/app/outputs/yolo_training_4_4
      - UNET_MODEL_PATH=models/unet_multiclass_best.pth
      - MODEL_CACHE_DIR=/app/model-cache
      - MODEL_STORAGE_ENABLED=true
      - MODEL_STORAGE_CONNECTION_STRING=${MODEL_STORAGE_CONNECTION_STRING:?MODEL_STORAGE_CONNECTION_STRING is required}
      - MODEL_STORAGE_CONTAINER=models
      - MODEL_STORAGE_ACTIVE_YOLO_KEY=scoring/active/yolo/model.pt
      - MODEL_STORAGE_ACTIVE_UNET_KEY=scoring/active/unet/model.pth
      - MODEL_STORAGE_ACTIVE_PPE_KEY=ppe/active/model.pt
      - MODEL_FORCE_REFRESH=false
      - MODEL_REQUIRE_BLOB=true
      - MAX_BATCH_IMAGES=5
      - REQUEST_TIMEOUT_SEC=30
      - INFERENCE_BATCH_CONCURRENCY=2
      - INFERENCE_DEADLINE_SEC=30
      - PENDING_LOWER_BOUND=50
      - YOLO_CONF=0.25
      - UNET_IMG_SIZE=384
      - SCORING_PENALTY_LABELS=metal,paper,plastic,trash,marks,garbage,rubbish,litter,waste,debris,bottle,plastic_bottle,can,cup,cardboard,bag,trash_bag
      - SCORING_OBJECT_PENALTY_PER_DETECTION=10
      - SCORING_CALIBRATION_ENABLED=true
      - SCORING_HIGH_RISK_REVIEW_ENVS=RESTROOM,HOSPITAL_OR
      - SCORING_IGNORED_OBJECT_REVIEW_COUNT=2
      - SCORING_IGNORED_OBJECT_REVIEW_LABELS=person,skis,snowboard
      - SCORING_UNET_ONLY_REVIEW_MIN_PCT=20
      - SCORING_UNET_ONLY_REVIEW_MAX_PCT=60
      - SCORING_SINGLE_SAM3_REVIEW_MAX_PREDICTIONS=1
      - SCORING_STRONG_DIRTY_COVERAGE_PCT=45
      - VISUALIZE_JPEG_QUALITY=92
      - VISUALIZE_TEMP_URL_TTL_SEC=900
      - VISUALIZE_TEMP_MAX_ITEMS=200
      - VISUALIZATION_BLOB_ENABLED=true
      - VISUALIZATION_BLOB_CONNECTION_STRING=${VISUALIZATION_BLOB_CONNECTION_STRING:-}
      - VISUALIZATION_BLOB_CONTAINER=visualizations
      - VISUALIZATION_BLOB_PREFIX=scoring/visualizations
      - SAM3_ENABLED=true
      - SAM3_REQUIRED=true
      - SAM3_PROVIDER=roboflow
      - SAM3_TIMEOUT_FALLBACK_ENABLED=true
      - SAM3_MIN_TIMEOUT_SEC=1
      - ROBOFLOW_API_URL=https://serverless.roboflow.com
      - ROBOFLOW_API_KEY=${ROBOFLOW_API_KEY:?ROBOFLOW_API_KEY is required}
      - ROBOFLOW_WORKSPACE=nams-workspace-fykkb
      - ROBOFLOW_WORKFLOW_ID=general-segmentation-api-14
      - ROBOFLOW_CLASSES=Garbage, Trash, Debris, Stain, Wet_Floor
      - ROBOFLOW_DIRTY_LABELS=Garbage, Stain, dirty_area, marks, trash, debris
      - ROBOFLOW_WET_LABELS=Wet_Floor, wet_surface, water, spill, puddle
      - ROBOFLOW_USE_CACHE=true
      - SAM3_CHECKPOINT_PATH=/app/model-cache/sam3/sam3.pt
      - SAM3_RESOLUTION=1008
      - SAM3_CONFIDENCE_THRESHOLD=0.3
      - SAM3_PROMPTS=dirty area
      - SAM3_MAX_PROMPTS=7
      - SAM3_MIN_MASK_AREA_PX=64
      - SAM3_DEVICE=cpu
      - SAM3_USE_BFLOAT16=true
      - RETRAIN_API_ENABLED=true
      - RETRAIN_API_KEY=${RETRAIN_API_KEY:-}
      - RETRAIN_USE_REMOTE_TRAINER=true
      - RETRAIN_TRAINER_BASE_URL=${RETRAIN_TRAINER_BASE_URL:?RETRAIN_TRAINER_BASE_URL is required}
      - RETRAIN_TRAINER_SUBMIT_PATH=/trainer/jobs
      - RETRAIN_TRAINER_API_KEY=${RETRAIN_TRAINER_API_KEY:-}
      - RETRAIN_TRAINER_TIMEOUT_SEC=7200
      - RETRAIN_COMMAND=
      - RETRAIN_COMMAND_TIMEOUT_SEC=7200
      - RETRAIN_WORKDIR=/app
      - RETRAIN_STORAGE_CONNECTION_STRING=${RETRAIN_STORAGE_CONNECTION_STRING:-}
      - RETRAIN_CONTAINER=retrain
      - RETRAIN_EXTERNAL_PREFIX=scoring/external/latest
      - RETRAIN_CANDIDATE_ARCHIVE_PREFIX=scoring/external/candidates
      - RETRAIN_CANDIDATE_YOLO_FILE=outputs/retrain/candidate/yolo_best.pt
      - RETRAIN_CANDIDATE_UNET_FILE=outputs/retrain/candidate/unet_best.pth
      - RETRAIN_CANDIDATE_METRICS_FILE=outputs/retrain/candidate_metrics.json
      - RETRAIN_ALLOW_EXISTING_BLOB_CANDIDATE=true
      - PPE_ENABLED=true
      - PPE_MODEL_PATH=/app/model-cache/active/ppe/model.pt
      - PPE_DEFAULT_MIN_CONFIDENCE=0.25
      - PPE_GEMINI_ENABLED=${PPE_GEMINI_ENABLED:-true}
      - PPE_GEMINI_MODE=missing_only
      - PPE_GEMINI_MODEL=gemini-2.5-flash-lite
      - PPE_GEMINI_TIMEOUT_SEC=8
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BASE_URL=https://generativelanguage.googleapis.com/v1beta
    ports:
      - "8000:8000"
    volumes:
      - cleanopsai-scoring-outputs:/app/outputs
      - cleanopsai-model-cache:/app/model-cache
      - ./models:/app/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').getcode() == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  cleanops-ai-scoring-api-sam3:
    profiles: ["sam3"]
    build:
      context: .
      dockerfile: Dockerfile.sam3
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=${APP_PORT:-8000}
      - APP_RELOAD=false
      - BASE_OUTPUT_DIR=${BASE_OUTPUT_DIR:-/app/outputs}
      - YOLO_TRAIN_PROJECT_DIR=${YOLO_TRAIN_PROJECT_DIR:-/app/outputs/yolo_training_4_4}
      - UNET_MODEL_PATH=${UNET_MODEL_PATH:-models/unet_multiclass_best.pth}
      - MODEL_CACHE_DIR=${MODEL_CACHE_DIR:-/app/model-cache}
      - MODEL_STORAGE_ENABLED=${MODEL_STORAGE_ENABLED:-true}
      - MODEL_STORAGE_CONNECTION_STRING=${MODEL_STORAGE_CONNECTION_STRING:-}
      - MODEL_STORAGE_CONTAINER=${MODEL_STORAGE_CONTAINER:-models}
      - MODEL_STORAGE_ACTIVE_YOLO_KEY=${MODEL_STORAGE_ACTIVE_YOLO_KEY:-scoring/active/yolo/model.pt}
      - MODEL_STORAGE_ACTIVE_UNET_KEY=${MODEL_STORAGE_ACTIVE_UNET_KEY:-scoring/active/unet/model.pth}
      - MODEL_STORAGE_ACTIVE_PPE_KEY=${MODEL_STORAGE_ACTIVE_PPE_KEY:-ppe/active/model.pt}
      - MODEL_FORCE_REFRESH=${MODEL_FORCE_REFRESH:-false}
      - MODEL_REQUIRE_BLOB=${MODEL_REQUIRE_BLOB:-true}
      - SCORING_PENALTY_LABELS=${SCORING_PENALTY_LABELS:-metal,paper,plastic,trash,marks,garbage,rubbish,litter,waste,debris,bottle,plastic_bottle,can,cup,cardboard,bag,trash_bag}
      - SCORING_OBJECT_PENALTY_PER_DETECTION=${SCORING_OBJECT_PENALTY_PER_DETECTION:-10}
      - SCORING_CALIBRATION_ENABLED=${SCORING_CALIBRATION_ENABLED:-true}
      - SCORING_HIGH_RISK_REVIEW_ENVS=${SCORING_HIGH_RISK_REVIEW_ENVS:-RESTROOM,HOSPITAL_OR}
      - SCORING_IGNORED_OBJECT_REVIEW_COUNT=${SCORING_IGNORED_OBJECT_REVIEW_COUNT:-2}
      - SCORING_IGNORED_OBJECT_REVIEW_LABELS=${SCORING_IGNORED_OBJECT_REVIEW_LABELS:-person,skis,snowboard}
      - SCORING_UNET_ONLY_REVIEW_MIN_PCT=${SCORING_UNET_ONLY_REVIEW_MIN_PCT:-20}
      - SCORING_UNET_ONLY_REVIEW_MAX_PCT=${SCORING_UNET_ONLY_REVIEW_MAX_PCT:-60}
      - SCORING_SINGLE_SAM3_REVIEW_MAX_PREDICTIONS=${SCORING_SINGLE_SAM3_REVIEW_MAX_PREDICTIONS:-1}
      - SCORING_STRONG_DIRTY_COVERAGE_PCT=${SCORING_STRONG_DIRTY_COVERAGE_PCT:-45}
      - VISUALIZE_JPEG_QUALITY=${VISUALIZE_JPEG_QUALITY:-92}
      - VISUALIZATION_BLOB_ENABLED=${VISUALIZATION_BLOB_ENABLED:-true}
      - VISUALIZATION_BLOB_CONNECTION_STRING=${VISUALIZATION_BLOB_CONNECTION_STRING:-}
      - VISUALIZATION_BLOB_CONTAINER=${VISUALIZATION_BLOB_CONTAINER:-visualizations}
      - VISUALIZATION_BLOB_PREFIX=${VISUALIZATION_BLOB_PREFIX:-scoring/visualizations}
      - INFERENCE_BATCH_CONCURRENCY=${INFERENCE_BATCH_CONCURRENCY:-1}
      - SAM3_ENABLED=true
      - SAM3_REQUIRED=true
      - SAM3_PROVIDER=local
      - SAM3_CHECKPOINT_PATH=${SAM3_CHECKPOINT_PATH:-/app/model-cache/sam3/sam3.pt}
      - SAM3_RESOLUTION=${SAM3_RESOLUTION:-1008}
      - SAM3_CONFIDENCE_THRESHOLD=${SAM3_CONFIDENCE_THRESHOLD:-0.3}
      - SAM3_PROMPTS=${SAM3_PROMPTS:-dirty area}
      - SAM3_MAX_PROMPTS=${SAM3_MAX_PROMPTS:-7}
      - SAM3_MIN_MASK_AREA_PX=${SAM3_MIN_MASK_AREA_PX:-64}
      - SAM3_DEVICE=cuda
      - SAM3_USE_BFLOAT16=true
      - PPE_ENABLED=${PPE_ENABLED:-true}
      - PPE_MODEL_PATH=${PPE_MODEL_PATH:-/app/model-cache/active/ppe/model.pt}
      - PPE_DEFAULT_MIN_CONFIDENCE=${PPE_DEFAULT_MIN_CONFIDENCE:-0.25}
      - PPE_GEMINI_ENABLED=${PPE_GEMINI_ENABLED:-true}
      - PPE_GEMINI_MODE=${PPE_GEMINI_MODE:-missing_only}
      - PPE_GEMINI_MODEL=${PPE_GEMINI_MODEL:-gemini-2.5-flash-lite}
      - PPE_GEMINI_TIMEOUT_SEC=${PPE_GEMINI_TIMEOUT_SEC:-8}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      - APP_PUBLIC_BASE_URL=${APP_PUBLIC_BASE_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      - cleanopsai-scoring-outputs:/app/outputs
      - cleanopsai-model-cache:/app/model-cache
      - ./models:/app/models:ro
    gpus: all
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').getcode() == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  cleanops-ai-scoring-trainer:
    profiles: ["trainer"]
    build:
      context: .
      dockerfile: Dockerfile.train
    environment:
      - BASE_OUTPUT_DIR=${BASE_OUTPUT_DIR:-/app/outputs}
      - YOLO_TRAIN_PROJECT_DIR=${YOLO_TRAIN_PROJECT_DIR:-/app/outputs/yolo_training_4_4}
      - TRAINER_API_ENABLED=${TRAINER_API_ENABLED:-true}
      - TRAINER_API_KEY=${RETRAIN_TRAINER_API_KEY:-}
      - TRAINER_COMMAND=${SCORING_TRAIN_COMMAND:-python scripts/run_retrain_pipeline.py}
      - TRAINER_TIMEOUT_SEC=${TRAINER_TIMEOUT_SEC:-7200}
      - TRAINER_WORKDIR=${TRAINER_WORKDIR:-/app}
      - MODEL_STORAGE_CONNECTION_STRING=${MODEL_STORAGE_CONNECTION_STRING:-}
      - RETRAIN_STORAGE_CONNECTION_STRING=${RETRAIN_STORAGE_CONNECTION_STRING:-}
      - RETRAIN_CONTAINER=${RETRAIN_CONTAINER:-retrain}
      - RETRAIN_EXTERNAL_PREFIX=${RETRAIN_EXTERNAL_PREFIX:-scoring/external/latest}
      - RETRAIN_CANDIDATE_ARCHIVE_PREFIX=${RETRAIN_CANDIDATE_ARCHIVE_PREFIX:-scoring/external/candidates}
      - RETRAIN_USE_ACTIVE_BASELINE=${RETRAIN_USE_ACTIVE_BASELINE:-true}
      - RETRAIN_REQUIRE_ACTIVE_BASELINE=${RETRAIN_REQUIRE_ACTIVE_BASELINE:-true}
      - RETRAIN_ALLOW_BASE_FALLBACK=${RETRAIN_ALLOW_BASE_FALLBACK:-false}
      - RETRAIN_ACTIVE_MODELS_CONTAINER=${RETRAIN_ACTIVE_MODELS_CONTAINER:-models}
      - RETRAIN_ACTIVE_YOLO_KEY=${RETRAIN_ACTIVE_YOLO_KEY:-scoring/active/yolo/model.pt}
      - RETRAIN_ACTIVE_UNET_KEY=${RETRAIN_ACTIVE_UNET_KEY:-scoring/active/unet/model.pth}
      - RETRAIN_ACTIVE_BASE_ROOT=${RETRAIN_ACTIVE_BASE_ROOT:-data/retrain_active_base}
      - RETRAIN_SAMPLES_CONTAINER=${RETRAIN_SAMPLES_CONTAINER:-retrain-samples}
      - RETRAIN_SAMPLES_PREFIX=${RETRAIN_SAMPLES_PREFIX:-scoring/retrain-samples}
      - RETRAIN_DATASET_ROOT=${RETRAIN_DATASET_ROOT:-data/retrain_bridge}
      - RETRAIN_MIN_APPROVED_ANNOTATIONS=${RETRAIN_MIN_APPROVED_ANNOTATIONS:-5}
      - RETRAIN_DATASET_LIMIT=${RETRAIN_DATASET_LIMIT:-5}
      - RETRAIN_TRAIN_RATIO=${RETRAIN_TRAIN_RATIO:-0.8}
      - RETRAIN_VALID_RATIO=${RETRAIN_VALID_RATIO:-0.1}
      - RETRAIN_ONLY_AFTER_DATE=${RETRAIN_ONLY_AFTER_DATE:-}
      - RETRAIN_FREEZE_YOLO=${RETRAIN_FREEZE_YOLO:-true}
      - RETRAIN_YOLO_MODEL=${RETRAIN_YOLO_MODEL:-yolov8n.pt}
      - RETRAIN_YOLO_EPOCHS=${RETRAIN_YOLO_EPOCHS:-1}
      - RETRAIN_YOLO_BATCH=${RETRAIN_YOLO_BATCH:-1}
      - RETRAIN_YOLO_IMGSZ=${RETRAIN_YOLO_IMGSZ:-320}
      - RETRAIN_YOLO_DEVICE=${RETRAIN_YOLO_DEVICE:-auto}
      - RETRAIN_YOLO_HALF=${RETRAIN_YOLO_HALF:-true}
      - RETRAIN_YOLO_WORKERS=${RETRAIN_YOLO_WORKERS:-0}
      - RETRAIN_YOLO_PROJECT_DIR=${RETRAIN_YOLO_PROJECT_DIR:-outputs/retrain/yolo_training}
      - RETRAIN_YOLO_RUN_NAME=${RETRAIN_YOLO_RUN_NAME:-candidate}
      - RETRAIN_UNET_EPOCHS=${RETRAIN_UNET_EPOCHS:-1}
      - RETRAIN_UNET_BATCH=${RETRAIN_UNET_BATCH:-1}
      - RETRAIN_UNET_IMGSZ=${RETRAIN_UNET_IMGSZ:-256}
      - RETRAIN_UNET_WORKERS=${RETRAIN_UNET_WORKERS:-0}
      - RETRAIN_UNET_ENCODER=${RETRAIN_UNET_ENCODER:-resnet18}
      - RETRAIN_UNET_ENCODER_WEIGHTS=${RETRAIN_UNET_ENCODER_WEIGHTS:-none}
      - RETRAIN_CANDIDATE_YOLO_FILE=${RETRAIN_CANDIDATE_YOLO_FILE:-outputs/retrain/candidate/yolo_best.pt}
      - RETRAIN_CANDIDATE_UNET_FILE=${RETRAIN_CANDIDATE_UNET_FILE:-outputs/retrain/candidate/unet_best.pth}
      - RETRAIN_CANDIDATE_METRICS_FILE=${RETRAIN_CANDIDATE_METRICS_FILE:-outputs/retrain/candidate_metrics.json}
    volumes:
      - cleanopsai-scoring-outputs:/app/outputs
      - ./data:/app/data
      - ./models:/app/models
      - ./unet_dataset:/app/unet_dataset
    expose:
      - "8001"
    restart: "no"

volumes:
  cleanopsai-scoring-outputs:
    name: cleanopsai-scoring-outputs
  cleanopsai-model-cache:
    name: cleanopsai-model-cache
